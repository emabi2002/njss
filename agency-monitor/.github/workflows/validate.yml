name: Build and validate agency monitor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholderagency.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-only
      - name: PostgreSQL migration and workflow smoke tests
        env:
          PGPASSWORD: disposable_ci_only
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023000100_initial_monitoring.sql
          psql -v ON_ERROR_STOP=1 -f tests/database/assertions.sql
