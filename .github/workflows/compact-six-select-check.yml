name: Compact Six Select Check

on:
  push:
    branches: [cleanup-priority-procurement-officer]
    paths:
      - 'lib/lookup-select-compact.test.js'
      - 'app/dashboard/budget-template/page.tsx'
      - 'scripts/add-select-only-to-three-lookups.py'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SUPABASE_NETWORK_ENABLED: "false"
      NEXT_PUBLIC_RBAC_ENFORCED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply approved cleanup
        run: python3 scripts/add-select-only-to-three-lookups.py
      - name: Regression test
        run: bun test lib/lookup-select-compact.test.js
      - name: Full validation
        run: |
          bun run lint
          bun run typecheck
          bun run build
      - name: Commit verified implementation
        run: |
          if git diff --quiet -- app/dashboard/budget-template/page.tsx; then
            echo "No production changes to commit."
            exit 0
          fi
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/budget-template/page.tsx
          git commit -m "feat: simplify priority procurement and officer lookups"
          git push
