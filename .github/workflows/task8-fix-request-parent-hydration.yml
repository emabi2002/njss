name: Task 8 fix request parent hydration

on:
  push:
    branches:
      - feature/budget-revision-workspace
    paths:
      - .github/workflows/task8-fix-request-parent-hydration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
          fetch-depth: 0
      - name: Preserve explicit parent during async candidate load
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/dashboard/budget/revisions/BudgetRevisionRequestDialog.tsx'
          let source = fs.readFileSync(path, 'utf8')

          const oldInitial = '  const initialCandidate = candidates.find((item) => item.submission_id === initialParentId) || candidates[0] || null'
          const newInitial = '  const initialCandidate = (initialParentId ? candidates.find((item) => item.submission_id === initialParentId) : candidates[0]) || null'
          if (!source.includes(oldInitial)) throw new Error('Initial candidate expression not found')
          source = source.replace(oldInitial, newInitial)

          const marker = `  const selectedCandidate = candidates.find((item) => item.submission_id === parentSubmissionId) || null\n\n  useEffect(() => {\n    if (!selectedCandidate) {`
          const replacement = `  const selectedCandidate = candidates.find((item) => item.submission_id === parentSubmissionId) || null\n\n  useEffect(() => {\n    if (parentSubmissionId || candidates.length === 0) return\n    const next = (initialParentId ? candidates.find((item) => item.submission_id === initialParentId) : candidates[0]) || null\n    if (!next) {\n      if (initialParentId) {\n        Promise.resolve().then(() => setError(\"The selected approved budget is no longer eligible for a new revision request. Refresh the workspace and select the current authoritative budget.\"))\n      }\n      return\n    }\n    Promise.resolve().then(() => {\n      setBudgetYear(String(next.budget_year))\n      setDepartmentId(next.department_id || \"\")\n      setDivisionId(next.division_id || \"\")\n      setParentSubmissionId(next.submission_id)\n      setEffectiveDate(dateForBudgetYear(next.budget_year))\n    })\n  }, [candidates, initialParentId, parentSubmissionId])\n\n  useEffect(() => {\n    if (!selectedCandidate) {`
          if (!source.includes(marker)) throw new Error('Selected candidate effect marker not found')
          source = source.replace(marker, replacement)

          fs.writeFileSync(path, source)
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/budget/revisions/BudgetRevisionRequestDialog.tsx
          git rm .github/workflows/task8-fix-request-parent-hydration.yml
          git commit -m "fix: preserve requested parent after async load"
          git push origin HEAD:feature/budget-revision-workspace
