name: Apply Task 7 Role-aware Revision UI

on:
  push:
    branches:
      - feature/budget-revision-implementation
    paths:
      - .github/workflows/apply-task7-role-aware-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-implementation
          fetch-depth: 0

      - name: Apply role-aware UI correction
        run: python scripts/apply-task7-role-aware-ui.py

      - name: Commit correction and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-task7-role-aware-ui.yml scripts/apply-task7-role-aware-ui.py
          git add app/dashboard/budget-template/page.tsx
          git commit -m "fix: enforce revision business roles in UI"
          git push origin HEAD:feature/budget-revision-implementation
