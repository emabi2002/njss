name: Task 8 migration source fix

on:
  push:
    branches:
      - feature/budget-revision-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
      - name: Fix eligible supervisor ordering and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/055_budget_revision_workspace_notifications.sql')
          text = path.read_text()
          old = "  ORDER BY COALESCE(u.full_name, u.email), u.email;"
          new = "  ORDER BY u.full_name NULLS LAST, u.email;"
          if old not in text:
              raise SystemExit('expected supervisor ORDER BY not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/task8-fix-migration-source.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/055_budget_revision_workspace_notifications.sql .github/workflows/task8-fix-migration-source.yml
          git commit -m "fix: use valid supervisor query ordering"
          git push origin HEAD:feature/budget-revision-workspace
