name: Compact Select Only Check

on:
  push:
    branches: [cleanup-three-lookup-columns]
    paths:
      - 'scripts/compact-select-only-migration.py'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SUPABASE_NETWORK_ENABLED: "false"
      NEXT_PUBLIC_RBAC_ENFORCED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply approved cleanup
        run: python3 scripts/compact-select-only-migration.py
      - name: Regression test
        run: bun test lib/lookup-select-compact.test.js
      - name: Full validation
        run: |
          git diff --check
          bun run lint
          bun run typecheck
          bun run build
      - name: Commit verified implementation
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LookupSelect.tsx app/dashboard/budget-template/page.tsx
          git diff --cached --check
          git commit -m "feat: remove duplicate compact lookup controls"
          git push origin HEAD:cleanup-three-lookup-columns
