name: Budget Cycle UI One-Off

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run budget cycle UI migration'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SUPABASE_NETWORK_ENABLED: "false"
      NEXT_PUBLIC_RBAC_ENFORCED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read relevant Next.js client-component guide
        shell: bash
        run: |
          set -euo pipefail
          DOC="$(grep -RIl --include='*.md' --include='*.mdx' 'Client Components' node_modules/next/dist/docs | head -n 1 || true)"
          if [ -z "$DOC" ]; then
            echo "Could not locate the required Next.js client-component guide under node_modules/next/dist/docs."
            exit 1
          fi
          echo "Reading $DOC before implementation"
          sed -n '1,220p' "$DOC"

      - name: RED - write regression tests first and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/budget-cycle-ui.test.ts <<'EOF'
          import { expect, test } from "bun:test"
          import { readFile } from "node:fs/promises"

          type Cycle = {
            id: string
            budget_year: number
            cycle_type: string
            name: string
            department_ceiling: number | null
          }

          type Subject = {
            findDuplicateBudgetCycle?: (cycles: Cycle[], budgetYear: number, cycleType: string) => Cycle | undefined
            selectBudgetCycle?: (cycles: Cycle[], cycleId: string) => { cycle_id: string; budget_ceiling: string }
          }

          async function loadSubject(): Promise<Subject> {
            try {
              return (await import("./budget-cycle-ui")) as Subject
            } catch {
              return {}
            }
          }

          const cycles: Cycle[] = [
            { id: "cycle-2026", budget_year: 2026, cycle_type: "ANNUAL", name: "FY2026 Annual Divisional Budget", department_ceiling: 6000000 },
            { id: "cycle-zero", budget_year: 2027, cycle_type: "ANNUAL", name: "FY2027 Annual Divisional Budget", department_ceiling: 0 },
          ]

          test("detects an existing budget cycle regardless of cycle-type case and whitespace", async () => {
            const subject = await loadSubject()
            expect(typeof subject.findDuplicateBudgetCycle).toBe("function")
            expect(subject.findDuplicateBudgetCycle!(cycles, 2026, " annual ")?.id).toBe("cycle-2026")
          })

          test("selecting a budget cycle also returns its default ceiling", async () => {
            const subject = await loadSubject()
            expect(typeof subject.selectBudgetCycle).toBe("function")
            expect(subject.selectBudgetCycle!(cycles, "cycle-2026")).toEqual({ cycle_id: "cycle-2026", budget_ceiling: "6000000" })
            expect(subject.selectBudgetCycle!(cycles, "cycle-zero")).toEqual({ cycle_id: "cycle-zero", budget_ceiling: "0" })
          })

          test("budget preparation exposes an administrator quick-add control instead of an always-open form", async () => {
            const source = await readFile(new URL("../app/dashboard/budget-template/page.tsx", import.meta.url), "utf8")
            expect(source).toContain("const [showCycleForm, setShowCycleForm] = useState(false)")
            expect(source).toContain('aria-label={showCycleForm ? "Close add budget cycle form" : "Add budget cycle"}')
            expect(source).toContain("{canAdmin && showCycleForm && (")
            expect(source).toContain("onChange={(e) => selectCycle(e.target.value)}")
          })
          EOF

          set +e
          bun test lib/budget-cycle-ui.test.ts
          RED_STATUS=$?
          set -e
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "Expected the new regression tests to fail before implementation, but they passed."
            exit 1
          fi
          echo "RED confirmed: the requested behavior is absent before implementation."

      - name: GREEN - implement approved budget-cycle quick-add design
        shell: bash
        run: |
          set -euo pipefail

          cat > lib/budget-cycle-ui.ts <<'EOF'
          export type BudgetCycleOption = {
            id: string
            budget_year: number
            cycle_type: string
            name: string
            department_ceiling?: number | null
          }

          const normalizeCycleType = (value: string) => value.trim().toUpperCase()

          export function findDuplicateBudgetCycle<T extends BudgetCycleOption>(cycles: T[], budgetYear: number, cycleType: string): T | undefined {
            const normalizedType = normalizeCycleType(cycleType)
            return cycles.find((cycle) => Number(cycle.budget_year) === Number(budgetYear) && normalizeCycleType(cycle.cycle_type) === normalizedType)
          }

          export function selectBudgetCycle(cycles: BudgetCycleOption[], cycleId: string) {
            const cycle = cycles.find((item) => item.id === cycleId)
            return {
              cycle_id: cycleId,
              budget_ceiling: cycle ? String(cycle.department_ceiling ?? "") : "",
            }
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/dashboard/budget-template/page.tsx")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              'import { loadActiveUsers, loadLookup } from "@/lib/lookups"\n',
              'import { loadActiveUsers, loadLookup } from "@/lib/lookups"\nimport { findDuplicateBudgetCycle, selectBudgetCycle } from "@/lib/budget-cycle-ui"\n',
              "budget-cycle helper import",
          )

          replace_once(
              '  const [divisionSearch, setDivisionSearch] = useState("")\n  const [newCycle, setNewCycle] = useState({ budget_year: String(new Date().getFullYear() + 1), cycle_type: "ANNUAL", name: "", submission_deadline: "", department_ceiling: "" })\n',
              '  const [divisionSearch, setDivisionSearch] = useState("")\n  const [showCycleForm, setShowCycleForm] = useState(false)\n  const [newCycle, setNewCycle] = useState({ budget_year: String(new Date().getFullYear() + 1), cycle_type: "ANNUAL", name: "", submission_deadline: "", department_ceiling: "" })\n',
              "budget-cycle form state",
          )

          replace_once(
              '''      if (!draftHeader.cycle_id && lookupData.cycles?.[0]) {
        setDraftHeader((h) => ({ ...h, cycle_id: lookupData.cycles[0].id, budget_ceiling: String(lookupData.cycles[0].department_ceiling || "") }))
      }
    } catch (err) {
      setMessage({ type: "err", text: err instanceof Error ? err.message : "Could not load the budget template workspace." })
    } finally {
      setLoading(false)
    }
  }, [draftHeader.cycle_id])
''',
              '''      setDraftHeader((header) => {
        if (header.cycle_id || !lookupData.cycles?.[0]) return header
        const defaultCycle = lookupData.cycles[0]
        return { ...header, cycle_id: defaultCycle.id, budget_ceiling: String(defaultCycle.department_ceiling ?? "") }
      })
    } catch (err) {
      setMessage({ type: "err", text: err instanceof Error ? err.message : "Could not load the budget template workspace." })
    } finally {
      setLoading(false)
    }
  }, [])
''',
              "dashboard default-cycle selection",
          )

          replace_once(
              '''  const createSubmission = async () => {
''',
              '''  const selectCycle = (cycleId: string) => {
    setDraftHeader((header) => ({ ...header, ...selectBudgetCycle(lookups.cycles, cycleId) }))
  }

  const createSubmission = async () => {
''',
              "cycle selection handler",
          )

          replace_once(
              '''  const addCycle = async () => {
    if (!canAdmin || !newCycle.budget_year.trim() || !newCycle.cycle_type.trim() || !newCycle.name.trim()) return
    setSaving(true)
    try {
      const created = await createBudgetCycle({
        budget_year: Number(newCycle.budget_year),
        cycle_type: newCycle.cycle_type,
        name: newCycle.name,
        submission_deadline: newCycle.submission_deadline || null,
        department_ceiling: Number(newCycle.department_ceiling || 0),
        instructions: "Created from Budget Preparation controlled setup.",
      })
      setDraftHeader((h) => ({ ...h, cycle_id: created.id, budget_ceiling: String(created.department_ceiling || "") }))
      setNewCycle({ budget_year: String(created.budget_year + 1), cycle_type: "ANNUAL", name: "", submission_deadline: "", department_ceiling: "" })
      await loadDashboard()
      setMessage({ type: "ok", text: "Budget cycle added to the controlled budget cycle register." })
    } catch (err) {
      setMessage({ type: "err", text: err instanceof Error ? err.message : "Could not add budget cycle." })
    } finally {
      setSaving(false)
    }
  }
''',
              '''  const addCycle = async () => {
    setMessage(null)
    if (!canAdmin) return

    const budgetYear = Number(newCycle.budget_year)
    const cycleType = newCycle.cycle_type.trim().toUpperCase()
    const cycleName = newCycle.name.trim()

    if (!Number.isInteger(budgetYear) || budgetYear < 2000 || !cycleType || !cycleName) {
      setMessage({ type: "err", text: "Complete the financial year, cycle type and cycle name before creating a budget cycle." })
      return
    }

    const duplicate = findDuplicateBudgetCycle(lookups.cycles, budgetYear, cycleType)
    if (duplicate) {
      setDraftHeader((header) => ({ ...header, ...selectBudgetCycle(lookups.cycles, duplicate.id) }))
      setMessage({ type: "err", text: `An ${cycleType} budget cycle already exists for FY${budgetYear}: ${duplicate.name}. It has been selected from the list instead.` })
      return
    }

    setSaving(true)
    try {
      const created = await createBudgetCycle({
        budget_year: budgetYear,
        cycle_type: cycleType,
        name: cycleName,
        submission_deadline: newCycle.submission_deadline || null,
        department_ceiling: Number(newCycle.department_ceiling || 0),
        instructions: "Created from Budget Preparation controlled setup.",
      })
      await loadDashboard()
      setDraftHeader((header) => ({ ...header, cycle_id: created.id, budget_ceiling: String(created.department_ceiling ?? "") }))
      setShowCycleForm(false)
      setNewCycle({ budget_year: String(created.budget_year + 1), cycle_type: "ANNUAL", name: "", submission_deadline: "", department_ceiling: "" })
      setMessage({ type: "ok", text: "Budget cycle added to the controlled register and selected for this draft." })
    } catch (err) {
      const errorCode = typeof err === "object" && err && "code" in err ? String((err as { code?: unknown }).code || "") : ""
      if (errorCode === "23505") {
        setMessage({ type: "err", text: `An ${cycleType} budget cycle already exists for FY${budgetYear}. Refresh the list and select the existing cycle.` })
      } else {
        setMessage({ type: "err", text: err instanceof Error ? err.message : "Could not add budget cycle." })
      }
    } finally {
      setSaving(false)
    }
  }
''',
              "addCycle implementation",
          )

          replace_once(
              '''              <Field label="Budget cycle">
                <select value={draftHeader.cycle_id} onChange={(e) => setDraftHeader((h) => ({ ...h, cycle_id: e.target.value }))} className="input">
                  <option value="">Select cycle from database</option>
                  {lookups.cycles.map((cycle) => (
                    <option key={cycle.id} value={cycle.id}>
                      {cycle.name}
                    </option>
                  ))}
                </select>
                {canAdmin && (
                  <div className="mt-2 space-y-2 rounded-lg border border-amber-200 bg-amber-50 p-3">
                    <p className="text-[11px] text-amber-900">
                      Controlled master data only. Add missing cycles in central Ledger / Reference Data, then refresh this selector.
                    </p>
                    <input className="input" placeholder="Financial year, e.g. 2026" type="number" value={newCycle.budget_year} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, budget_year: e.target.value }))} />
                    <input className="input" placeholder="Cycle type, e.g. ANNUAL" value={newCycle.cycle_type} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, cycle_type: e.target.value }))} />
                    <input className="input" placeholder="Cycle name" value={newCycle.name} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, name: e.target.value }))} />
                    <input className="input" placeholder="Submission deadline" type="date" value={newCycle.submission_deadline} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, submission_deadline: e.target.value }))} />
                    <input className="input text-right" placeholder="Default budget ceiling" type="number" value={newCycle.department_ceiling} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, department_ceiling: e.target.value }))} />
                    <button type="button" onClick={addCycle} disabled={saving} className="btn-primary w-full justify-center">
                      Create controlled budget cycle
                    </button>
                  </div>
                )}
              </Field>
''',
              '''              <Field label="Budget cycle">
                <div className="flex items-center gap-2">
                  <select value={draftHeader.cycle_id} onChange={(e) => selectCycle(e.target.value)} className="input min-w-0 flex-1">
                    <option value="">Select cycle from database</option>
                    {lookups.cycles.map((cycle) => (
                      <option key={cycle.id} value={cycle.id}>
                        {cycle.name}
                      </option>
                    ))}
                  </select>
                  {canAdmin && (
                    <button
                      type="button"
                      onClick={() => {
                        setShowCycleForm((open) => !open)
                        setMessage(null)
                      }}
                      aria-label={showCycleForm ? "Close add budget cycle form" : "Add budget cycle"}
                      aria-expanded={showCycleForm}
                      title={showCycleForm ? "Close add budget cycle form" : "Add budget cycle"}
                      className="inline-flex h-[42px] w-[42px] shrink-0 items-center justify-center rounded-lg bg-emerald-600 text-white shadow-sm transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
                    >
                      <Plus className={`h-5 w-5 transition-transform ${showCycleForm ? "rotate-45" : ""}`} />
                    </button>
                  )}
                </div>
                {canAdmin && showCycleForm && (
                  <div className="mt-2 space-y-2 rounded-lg border border-emerald-200 bg-emerald-50 p-3">
                    <div>
                      <p className="text-xs font-semibold text-emerald-900">Add Budget Cycle</p>
                      <p className="mt-0.5 text-[11px] text-emerald-800">Create a missing cycle in the controlled budget-cycle register.</p>
                    </div>
                    <input className="input" placeholder="Financial year, e.g. 2027" type="number" value={newCycle.budget_year} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, budget_year: e.target.value }))} />
                    <input className="input" placeholder="Cycle type, e.g. ANNUAL" value={newCycle.cycle_type} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, cycle_type: e.target.value }))} />
                    <input className="input" placeholder="Cycle name" value={newCycle.name} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, name: e.target.value }))} />
                    <input className="input" placeholder="Submission deadline" type="date" value={newCycle.submission_deadline} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, submission_deadline: e.target.value }))} />
                    <input className="input text-right" placeholder="Default budget ceiling" type="number" min="0" value={newCycle.department_ceiling} onChange={(e) => setNewCycle((cycle) => ({ ...cycle, department_ceiling: e.target.value }))} />
                    <div className="flex gap-2 pt-1">
                      <button type="button" onClick={() => setShowCycleForm(false)} disabled={saving} className="btn-light flex-1 justify-center">
                        Cancel
                      </button>
                      <button type="button" onClick={addCycle} disabled={saving} className="inline-flex flex-1 items-center justify-center gap-2 rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
                        <Plus className="h-4 w-4" /> {saving ? "Creating..." : "Create"}
                      </button>
                    </div>
                  </div>
                )}
              </Field>
''',
              "budget-cycle field UI",
          )

          path.write_text(source)

          ci = Path(".github/workflows/ci.yml")
          ci_source = ci.read_text()
          old = '''      - name: Lint
        run: bun run lint
'''
          new = '''      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint
'''
          if ci_source.count(old) != 1:
              raise SystemExit("Could not add the test step to CI exactly once")
          ci.write_text(ci_source.replace(old, new, 1))
          PY

      - name: Verify GREEN and full application
        shell: bash
        run: |
          set -euo pipefail
          bun test lib/budget-cycle-ui.test.ts
          git diff --check
          bun run lint
          bun run typecheck
          bun run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/budget-template/page.tsx lib/budget-cycle-ui.ts lib/budget-cycle-ui.test.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "feat: add budget cycle quick-create UI"
          git push origin HEAD:main
