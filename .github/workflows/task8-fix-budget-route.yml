name: Task 8 budget route preservation fix

on:
  push:
    branches:
      - feature/budget-revision-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
      - name: Restore existing funding inputs and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/workflows/budget/route.ts')
          text = path.read_text()
          old = "    p_restricted_project_id: input.restricted_project_id || null,\n    p_restricted_section_id: input.restricted_section_id || null,"
          new = "    p_restricted_project_id: input.restricted_project_id || null,\n    p_restricted_department_id: input.restricted_department_id || null,\n    p_restricted_section_id: input.restricted_section_id || null,"
          if old not in text:
              raise SystemExit('expected restricted funding block not found')
          text = text.replace(old, new, 1)
          old_error = "Invalid funding authority workflow request"
          receipt_marker = "async function transitionFundingReceipt"
          before, after = text.split(receipt_marker, 1)
          if old_error not in after:
              raise SystemExit('expected funding receipt validation text not found')
          after = after.replace(old_error, 'Invalid funding receipt workflow request', 1)
          path.write_text(before + receipt_marker + after)
          Path('.github/workflows/task8-fix-budget-route.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/workflows/budget/route.ts .github/workflows/task8-fix-budget-route.yml
          git commit -m "fix: preserve existing funding workflow inputs"
          git push origin HEAD:feature/budget-revision-workspace
