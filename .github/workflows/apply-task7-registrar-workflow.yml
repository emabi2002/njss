name: Apply Task 7 Registrar Workflow

on:
  push:
    branches:
      - feature/budget-revision-implementation
    paths:
      - .github/workflows/apply-task7-registrar-workflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-implementation
          fetch-depth: 0

      - name: Apply approved workflow correction
        run: python scripts/apply-task7-registrar-workflow.py

      - name: Commit approved correction and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-task7-registrar-workflow.yml scripts/apply-task7-registrar-workflow.py
          git add supabase/migrations/054_budget_revision_hardening.sql app/api/workflows/budget/route.ts lib/budget-revision.ts app/dashboard/budget-template/page.tsx app/dashboard/budget-template/BudgetRevisionDialog.tsx
          git commit -m "fix: align revisions to Registrar request workflow"
          git push origin HEAD:feature/budget-revision-implementation
