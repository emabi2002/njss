name: Task 8 apply division ownership patch

on:
  push:
    branches: [feature/budget-revision-workspace]
    paths: [scripts/task8_patch_division_ownership.py]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
          fetch-depth: 0
      - run: python scripts/task8_patch_division_ownership.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/055_budget_revision_workspace_notifications.sql
          git rm scripts/task8_patch_division_ownership.py .github/workflows/task8-apply-division-ownership-patch.yml
          git commit -m "fix: align revision assignment with live division hierarchy"
          git push origin HEAD:feature/budget-revision-workspace
