name: Task 8 budget template workspace request routing

on:
  push:
    branches:
      - feature/budget-revision-workspace
    paths:
      - .github/workflows/task8-budget-template-workspace-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
          fetch-depth: 0
      - name: Route request initiation to dedicated workspace
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/dashboard/budget-template/page.tsx'
          let source = fs.readFileSync(path, 'utf8')

          source = source.replace('  createBudgetRevision,\n', '')
          source = source.replace('  type CreateBudgetRevisionInput,\n', '')
          source = source.replace('import { BudgetRevisionDialog } from "./BudgetRevisionDialog"\n', '')
          source = source.replace('  const [showRevisionDialog, setShowRevisionDialog] = useState(false)\n', '')

          const createFn = /\n  const createRevisionFromSelected = async \(input: CreateBudgetRevisionInput\) => \{[\s\S]*?\n  \}\n\n  const addCycle = async \(\) => \{/
          if (!createFn.test(source)) throw new Error('Inline revision creation function not found')
          source = source.replace(createFn, '\n  const addCycle = async () => {')

          const oldButton = `                  {canCreateRevision && (\n                    <button onClick={() => setShowRevisionDialog(true)} disabled={saving} className="btn-primary">\n                      <Plus className="h-4 w-4" /> Request Budget Change\n                    </button>\n                  )}`
          const newButton = `                  {canCreateRevision && (\n                    <button\n                      onClick={() => window.location.assign(\`/dashboard/budget/revisions?parent=\${selected.id}&action=request\`)}\n                      disabled={saving}\n                      className="btn-primary"\n                    >\n                      <Plus className="h-4 w-4" /> Request Budget Change\n                    </button>\n                  )}`
          if (!source.includes(oldButton)) throw new Error('Inline request button not found')
          source = source.replace(oldButton, newButton)

          const dialogBlock = /\n      \{selected && \(\n        <BudgetRevisionDialog[\s\S]*?\n      \)\}\n/
          if (!dialogBlock.test(source)) throw new Error('Inline BudgetRevisionDialog render not found')
          source = source.replace(dialogBlock, '\n')

          if (source.includes('<BudgetRevisionDialog')) throw new Error('Inline BudgetRevisionDialog still present')
          if (!source.includes('/dashboard/budget/revisions?parent=${selected.id}&action=request')) throw new Error('Dedicated workspace route missing')
          fs.writeFileSync(path, source)
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/budget-template/page.tsx
          git rm .github/workflows/task8-budget-template-workspace-route.yml
          git commit -m "fix: route budget change requests through workspace"
          git push origin HEAD:feature/budget-revision-workspace
