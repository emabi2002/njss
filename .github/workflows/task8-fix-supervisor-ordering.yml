name: Task 8 fix supervisor ordering

on:
  push:
    branches:
      - feature/budget-revision-workspace
    paths:
      - .github/workflows/task8-fix-supervisor-ordering.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/budget-revision-workspace
          fetch-depth: 0
      - name: Match DISTINCT order expressions
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'supabase/migrations/055_budget_revision_workspace_notifications.sql'
          let source = fs.readFileSync(path, 'utf8')
          const oldText = '  ORDER BY u.full_name NULLS LAST, u.email;'
          const newText = '  ORDER BY u.full_name::TEXT NULLS LAST, u.email::TEXT;'
          if (!source.includes(oldText)) throw new Error('Expected supervisor ordering expression not found')
          source = source.replace(oldText, newText)
          fs.writeFileSync(path, source)
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/055_budget_revision_workspace_notifications.sql
          git rm .github/workflows/task8-fix-supervisor-ordering.yml
          git commit -m "fix: use valid distinct supervisor ordering"
          git push origin HEAD:feature/budget-revision-workspace
