name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: njss-ci-only
          POSTGRES_DB: njss_rpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SUPABASE_NETWORK_ENABLED: "false"
      NEXT_PUBLIC_RBAC_ENFORCED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: RBAC regression checks
        run: node lib/rbac/four-group-rbac.test.mjs

      - name: Access Control readiness regression checks
        run: node lib/rbac/access-control-readiness.test.mjs

      - name: Server access-context regression checks
        run: node lib/rbac/server-access-context.test.mjs

      - name: Admin runtime fallback regression checks
        run: node lib/rbac/admin-runtime-fallback.test.mjs

      - name: User CRUD Edge routing regression checks
        run: node lib/rbac/user-crud-edge.test.mjs

      - name: Access Control privileged Edge routing regression checks
        run: node lib/rbac/access-admin-edge.test.mjs

      - name: Scoped dashboard regression checks
        run: node lib/rbac/dashboard-scope.test.mjs

      - name: Management reporting and drill-down regression checks
        run: node lib/rbac/management-reports.test.mjs

      - name: System Settings printable report branding regression checks
        run: node lib/rbac/report-branding.test.mjs

      - name: Role-aware workflow inbox regression checks
        run: node lib/rbac/workflow-inbox.test.mjs

      - name: Full and differential backup regression checks
        run: node lib/backup/full-differential-backup.test.mjs

      - name: Master-data cleanup regression checks
        run: node scripts/master-data-cleanup.test.mjs

      - name: Budget division selector regression checks
        run: node scripts/budget-division-selector.test.mjs

      - name: Budget checkbox row-selection regression checks
        run: node scripts/budget-row-selection.test.mjs

      - name: Budget entry full-width layout regression checks
        run: node scripts/budget-entry-layout.test.mjs

      - name: Budget revision and reforecast regression checks
        run: node scripts/budget-revision-reforecast.test.mjs

      - name: Budget revision reporting regression checks
        run: node scripts/budget-revision-reporting.test.mjs

      - name: Budget revision hardening regression checks
        run: node scripts/budget-revision-hardening.test.mjs

      - name: Budget revision workspace regression checks
        run: node scripts/budget-revision-workspace.test.mjs

      - name: Budget activation control regression checks
        run: node scripts/budget-activation-control.test.mjs

      - name: Approved Task 9 spec conformance checks
        run: node scripts/budget-activation-approved-spec-conformance.test.mjs

      - name: Password recovery route regression checks
        run: node scripts/national-uat/password-recovery-route.test.mjs

      - name: Repository governance regression checks
        run: node scripts/repository-governance.test.mjs

      - name: Migration governance regression checks
        run: node scripts/migration-governance.test.mjs

      - name: Critical SECURITY DEFINER RPC lockdown checks
        run: node scripts/critical-rpc-lockdown.test.mjs

      - name: RLS and legacy policy lockdown checks
        run: node scripts/rls-policy-lockdown.test.mjs

      - name: Budget RPC PostgreSQL runtime checks
        env:
          NJSS_TEST_DATABASE_URL: postgresql://postgres:njss-ci-only@127.0.0.1:5432/njss_rpc_test
        run: node scripts/critical-rpc-runtime.test.mjs

      - name: Client table privilege PostgreSQL runtime checks
        env:
          NJSS_TEST_DATABASE_URL: postgresql://postgres:njss-ci-only@127.0.0.1:5432/njss_rpc_test
        run: node scripts/client-table-privileges-runtime.test.mjs

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
